<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>員工線上測驗系統 - 考試</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="exam.html"><img src="images/logo.svg" alt="">員工線上測驗系統</a>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <a class="link hidden" id="link-admin" href="admin.html">管理後台</a>
      <button class="link" id="btn-logout" type="button">登出</button>
    </div>
  </header>

  <main class="container">
    <div class="tabs" id="main-tabs">
      <button class="tab active" data-view="subjects" type="button">科目考試</button>
      <button class="tab" data-view="history" type="button">我的考試記錄</button>
    </div>

    <section id="view-subjects"></section>
    <section id="view-exam" class="hidden"></section>
    <section id="view-result" class="hidden"></section>
    <section id="view-history" class="hidden"></section>
    <section id="view-review" class="hidden"></section>
  </main>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/user.js"></script>
</body>
</html>
