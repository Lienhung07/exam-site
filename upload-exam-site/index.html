<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>員工線上測驗系統 - 登入</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card card">
      <div class="logo">
        <img src="images/logo.svg" alt="系統標誌">
        <h1>員工線上測驗系統</h1>
        <div class="muted small">請登入後選擇科目開始考試</div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" type="button">登入</button>
        <button class="tab" id="tab-register" type="button">註冊</button>
      </div>

      <form id="form-login" class="stack" autocomplete="on">
        <label class="field"><span>Email</span><input type="email" id="login-email" required autocomplete="username"></label>
        <label class="field"><span>密碼</span><input type="password" id="login-pass" required autocomplete="current-password"></label>
        <button class="btn block" type="submit" id="btn-login">登入</button>
      </form>

      <form id="form-register" class="stack hidden" autocomplete="on">
        <label class="field"><span>姓名</span><input type="text" id="reg-name" required maxlength="60" autocomplete="name"></label>
        <label class="field"><span>員工編號</span><input type="text" id="reg-empid" required maxlength="30"></label>
        <label class="field"><span>Email</span><input type="email" id="reg-email" required autocomplete="username"></label>
        <label class="field"><span>密碼（至少 8 碼）</span><input type="password" id="reg-pass" required minlength="8" autocomplete="new-password"></label>
        <button class="btn block" type="submit" id="btn-register">建立帳號</button>
      </form>

      <div id="auth-msg" class="msg hidden"></div>
    </div>
  </main>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
